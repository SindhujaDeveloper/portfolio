<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0526" />
      <stop offset="60%" stop-color="#12071a" />
      <stop offset="100%" stop-color="#08030a" />
    </linearGradient>
    <radialGradient id="rg1" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0%" stop-color="#ff7a8f" stop-opacity="0.22" />
      <stop offset="60%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rg2" cx="0.12" cy="0.18" r="0.6">
      <stop offset="0%" stop-color="#5a2b8f" stop-opacity="0.16" />
      <stop offset="60%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="screen" />
    </filter>
  </defs>

  <!-- Base gradient -->
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- Large glows -->
  <circle cx="1560" cy="110" r="520" fill="url(#rg1)" filter="url(#soft)" />
  <circle cx="200" cy="180" r="420" fill="url(#rg2)" filter="url(#soft)" />

  <!-- Soft vignette -->
  <rect width="100%" height="100%" fill="black" opacity="0.28" />
  <g opacity="0.08" fill="#ffffff">
    <circle cx="420" cy="320" r="3" />
    <circle cx="480" cy="360" r="2" />
    <circle cx="520" cy="300" r="2" />
    <circle cx="1600" cy="220" r="3" />
    <circle cx="1700" cy="260" r="2" />
  </g>

  <!-- Decorative cubes -->
  <g opacity="0.12">
    <rect x="80" y="780" width="90" height="90" rx="8" transform="rotate(-18 125 825)" fill="#ff7a59" />
    <rect x="160" y="720" width="60" height="60" rx="8" transform="rotate(-18 190 750)" fill="#8c5bd6" />
    <rect x="1720" y="760" width="110" height="110" rx="12" transform="rotate(12 1775 815)" fill="#ff7a59" />
    <rect x="1520" y="820" width="80" height="80" rx="10" transform="rotate(6 1560 860)" fill="#5ec7ff" />
  </g>

  <!-- Subtle noise layer -->
  <rect width="100%" height="100%" fill="url(#g1)" opacity="0.02" />

</svg>
